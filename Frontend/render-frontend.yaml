# Frontend-only render.yaml
# Use this if deploying frontend separately
services:
  - type: web
    name: interview-frontend
    env: static
    plan: free
    branch: main
    buildCommand: npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_BACKEND_URL
        value: https://your-backend-url.onrender.com
