services:
  - type: web
    name: interview-backend
    env: node
    plan: standard
    root: Backend
    region: oregon
    branch: main
    nodeVersion: 20.11.0
    buildCommand: npm install --verbose --legacy-peer-deps
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
    autoDeploy: false

  - type: static_site
    name: interview-frontend
    root: Frontend
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install --verbose && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_BACKEND_URL
        sync: false
    autoDeploy: false
