services:
  - type: web
    name: interview-backend
    env: node
    plan: standard
    branch: main
    nodeVersion: 20.11.0
    buildCommand: cd Backend && npm ci
    startCommand: cd Backend && npm start
    healthCheckPath: /health
    preDeployCommand: cd Backend && npm ci
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --enable-source-maps
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
    autoDeploy: true

  - type: static_site
    name: interview-frontend
    plan: free
    branch: main
    buildCommand: cd Frontend && npm ci && npm run build
    staticPublishPath: Frontend/dist
    envVars:
      - key: VITE_BACKEND_URL
        sync: false
    autoDeploy: true
