services:
  - type: web
    name: interview-backend
    root: Backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        fromService:
          type: web
          name: interview-frontend
          envVarKey: RENDER_EXTERNAL_URL
    autoDeploy: true

  - type: web
    name: interview-frontend
    root: Frontend
    runtime: static
    buildCommand: npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: interview-backend
          envVarKey: RENDER_EXTERNAL_URL
    autoDeploy: true
