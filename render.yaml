services:
  - type: web
    name: interview-backend
    env: node
    plan: standard
    branch: main
    buildCommand: npm run build:backend
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
    autoDeploy: true

  - type: static_site
    name: interview-frontend
    plan: free
    branch: main
    buildCommand: npm run build:frontend
    staticPublishPath: Frontend/dist
    envVars:
      - key: VITE_BACKEND_URL
        sync: false
    autoDeploy: true
